server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/xml+rss text/xml image/svg+xml;
  gzip_min_length 1024;

  # Encaminha as chamadas de API para o container do backend na rede interna do
  # Compose. O serviço se chama "backend" e expõe :8080.
  location /api/v1/ {
    proxy_pass http://backend:8080/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Swagger e endpoints v3 também vão pro backend (úteis pra depurar em prod).
  location ~ ^/(swagger-ui|v3/api-docs) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  # Assets versionados pelo Vite (hash no nome) podem ter cache longo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: index.html nunca cacheia, demais paths caem em fallback pro index.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
