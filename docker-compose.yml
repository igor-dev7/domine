services:
  db:
    image: postgres:16-alpine
    container_name: domine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: domine
      POSTGRES_USER: domine
      POSTGRES_PASSWORD: domine123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domine -d domine"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: domine-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/domine
      SPRING_DATASOURCE_USERNAME: domine
      SPRING_DATASOURCE_PASSWORD: domine123
      JWT_SECRET: troqueEstaChaveSecretaParaProducao0123456789ABCDEF
      JWT_EXPIRATION_MS: 86400000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: domine-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1

volumes:
  pgdata:
    name: domine-pgdata
